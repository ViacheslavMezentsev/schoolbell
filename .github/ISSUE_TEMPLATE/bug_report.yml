name: Ошибка / Bug report
description: Сообщить о воспроизводимой ошибке / Report a reproducible problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Проверьте существующие Issues. Публикация открытая: удалите пароли, токены и личные данные. / Check existing issues. Remove secrets and personal data before posting."
  - type: dropdown
    id: component
    attributes:
      label: Компонент / Component
      options:
        - schoolbell
        - core
        - demo
        - rover
        - documentation / other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Версии модуля и ядра / Module and core versions
      placeholder: "schoolbell 5.0.1; core 0.4.0; commit/build ID if known"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Оборудование и окружение / Hardware and environment
      description: "Модель/ревизия роутера, OpenWrt, платы и периферия, браузер/ОС. Если не применимо, укажите это. / Router model, OpenWrt, boards, peripherals, browser/OS; use N/A where appropriate."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения / Steps to reproduce
      placeholder: "1. Откройте… / Open…
2. Нажмите… / Click…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат / Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат / Actual result
      description: "Укажите частоту повторения и влияние на работу. / Include frequency and impact."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Журнал и снимки экрана / Logs and screenshots
      description: "Необязательно. Короткий фрагмент, время и часовой пояс; вложения можно перетащить сюда. Без секретов и полных конфигураций. / Optional short excerpt, timestamp/time zone, screenshots; no secrets or full configurations."
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка публикации / Before posting
      options:
        - label: "Я проверил существующие Issues и удалил секреты и личные данные. / I checked existing issues and removed secrets and personal data."
          required: true
