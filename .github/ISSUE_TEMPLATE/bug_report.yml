name: Ошибка Школьника / Schoolbell bug
description: Сообщить о воспроизводимой ошибке / Report a reproducible problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "[Руководство](https://viacheslavmezentsev.github.io/schoolbell/guide.html) · [User guide](https://viacheslavmezentsev.github.io/schoolbell/guide.en.html). Проверьте [существующие Issues](https://github.com/ViacheslavMezentsev/schoolbell/issues). Публикация открытая: удалите пароли, токены и личные данные. / Check existing issues. Remove secrets and personal data before posting."
  - type: dropdown
    id: component
    attributes:
      label: Где возникла проблема / Affected area
      options:
        - Школьник на устройстве / Schoolbell on a device
        - Демо в браузере / Browser demo
        - Установка или обновление / Installation or upgrade
        - Документация / Documentation
        - Другое / Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Версия Школьника / Schoolbell version
      placeholder: "5.1.45; для демо — commit из вкладки Обратная связь / for demo: commit from Feedback"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Оборудование и окружение / Hardware and environment
      description: "Модель устройства, версия OpenWrt, браузер/ОС. Для сбоя звука — аудиокарта, USB-хаб и строка Аудио из шапки. / Device model, OpenWrt version, browser/OS. For audio problems: sound card, USB hub and the Audio header line."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения / Steps to reproduce
      placeholder: "1. Откройте… / Open…
2. Нажмите… / Click…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат / Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат / Actual result
      description: "Укажите частоту повторения и влияние на работу. / Include frequency and impact."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Журнал и снимки экрана / Logs and screenshots
      description: "Необязательно. Короткий фрагмент, время и часовой пояс; вложения можно перетащить сюда. Без секретов и полных конфигураций. / Optional short excerpt, timestamp/time zone, screenshots; no secrets or full configurations."
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка публикации / Before posting
      options:
        - label: "Я проверил существующие Issues и удалил секреты и личные данные. / I checked existing issues and removed secrets and personal data."
          required: true
