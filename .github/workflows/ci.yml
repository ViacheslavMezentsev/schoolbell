name: Schoolbell CI
on:
  push:
    branches: ['main', 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev gcc libc6-dev make python3
      - run: make all
      - run: git diff --check HEAD^ HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: schoolbell-candidate
          if-no-files-found: error
          path: out/modbus-schoolbell_*.ipk
