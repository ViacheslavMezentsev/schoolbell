name: Foundation CI
on:
  push:
    branches: ['main', 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD and its parent for the whitespace check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-foundation.py
      - run: git diff --check HEAD^ HEAD
